<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{'Edit' if student else 'Add'}} Student</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="form-page"><div class="form-card"><h1>{{'Edit' if student else 'Add'}} Student</h1><form method="post"><label>Name<input name="name" required value="{{student.name if student else ''}}"></label><label>Roll Number<input name="roll_no" required value="{{student.roll_no if student else ''}}"></label><label>Email<input type="email" name="email" required value="{{student.email if student else ''}}"></label><label>Course<input name="course" required value="{{student.course if student else 'Computer Science Engineering'}}"></label><label>Year<input type="number" name="year" min="1" max="6" required value="{{student.year if student else 2}}"></label><div class="row"><button class="btn">Save</button><a href="{{url_for('index')}}">Cancel</a></div></form></div></main></body></html>
